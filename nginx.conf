# Pool of app instances. Add `server 127.0.0.1:3001;` etc. to scale horizontally.
upstream ujenzi_backend {
    # ip_hash gives socket.io sticky sessions (its HTTP long-polling handshake must
    # hit one instance). Drop it only if clients are forced to transport: ['websocket'].
    ip_hash;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Per-client request cap in front of the app (the app's own throttler is per-instance).
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    location / {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://ujenzi_backend;
        proxy_http_version 1.1;

        # WebSocket support (keepalive to upstream needs an empty Connection otherwise)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry idempotent requests on another instance if one fails or restarts.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://ujenzi_backend;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
